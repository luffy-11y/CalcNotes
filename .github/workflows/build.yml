name: Build CalcNotes APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o project.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p src assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CalcNotes-debug-apk
          path: src/app/build/outputs/apk/debug/*.apk
